name: install-monochange
description: Install the pinned SHA256-verified monochange v0.21.0 binary

runs:
  using: composite
  steps:
    - name: install pinned monochange binary
      shell: bash
      run: |
        set -euo pipefail

        if [[ "$(uname -s)" != "Linux" || "$(uname -m)" != "x86_64" ]]; then
          echo "::error::install-monochange currently supports Linux x86_64 only." >&2
          exit 1
        fi

        # GitHub-hosted Ubuntu runners already include `~/.cargo/bin` on PATH.
        bin_dir="${CARGO_HOME:-$HOME/.cargo}/bin"
        mkdir -p "$bin_dir"

        version="0.21.0"
        url="https://github.com/monochange/monochange/releases/download/v${version}/monochange-x86_64-unknown-linux-musl-v${version}.tar.gz"
        expected_sha256="96bcd4357a2e89167551022ca5e1243155465658f227f79b2a87dff33e066553"

        tmp_dir="$(mktemp -d)"
        trap 'rm -rf "$tmp_dir"' EXIT

        curl \
          --fail \
          --silent \
          --show-error \
          --location \
          --retry 5 \
          --retry-delay 2 \
          --retry-all-errors \
          --output "$tmp_dir/monochange.tar.gz" \
          "$url"

        printf '%s  %s\n' "$expected_sha256" "$tmp_dir/monochange.tar.gz" | sha256sum --check --status - || {
          echo "::error::SHA256 verification failed for $url" >&2
          exit 1
        }

        mkdir -p "$tmp_dir/extract"
        tar -xzf "$tmp_dir/monochange.tar.gz" -C "$tmp_dir/extract"

        found="$(find "$tmp_dir/extract" -type f -name monochange -print -quit)"
        if [[ -z "$found" ]]; then
          echo "::error::Could not find binary 'monochange' in $url" >&2
          exit 1
        fi

        install -m 0755 "$found" "$bin_dir/monochange"
        ln -sf "$bin_dir/monochange" "$bin_dir/mc"
        "$bin_dir/monochange" --version
