name: release

# Creates and maintains the release pull request, rehearses that creation on every pull request,
# and cuts the tag, draft GitHub release, and publish dispatch once the release PR merges.
#
# A release is driven by changesets: a feature branch adds a changeset describing its version bump
# (`monochange run change --package mediapipe --bump patch --reason "..."`), and this workflow
# keeps one release PR open summarizing what the next version contains. Merging that PR is what
# cuts the release.
#
# The pull-request job is a rehearsal: it runs the same validation, release planning, preview
# summary, and lockfile refresh as the real release, but commits and opens nothing. A broken
# release preparation therefore fails on the pull request that caused it instead of on main.

on:
  push:
    branches: [main]
  pull_request: {}
  # Running by hand refreshes the release PR (or retries post-merge tagging/drafting if HEAD is a
  # merged release commit).
  workflow_dispatch:

permissions:
  contents: read

# Pull-request rehearsals supersede each other. Push runs are never cancelled: stopping a release
# after its tag is created but before `publish` is dispatched would strand it.
concurrency:
  group: release-${{ github.ref }}-${{ github.event_name != 'pull_request' && startsWith(github.event.head_commit.message, 'chore(release)') && 'post-merge' || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify-push:
    name: classify release commit
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      is-release: ${{ steps.record.outputs.is-release }}

    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: install monochange
        uses: $/.github/actions/install-monochange

      - name: detect current release commit
        id: record
        shell: bash
        run: |
          set -euo pipefail

          release_record_error="$(mktemp)"
          trap 'rm -f "$release_record_error"' EXIT

          if is_release="$(monochange step release-record --from HEAD --format json --jq '.resolved_commit == .record_commit' 2>"$release_record_error")"; then
            echo "is-release=${is_release}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          subject="$(git log -1 --pretty=%s)"
          body="$(git log -1 --pretty=%B)"
          if [[ "$subject" == chore\(release\):\ prepare\ release* ]] || grep -q '<!-- monochange:release-record:start -->' <<<"$body"; then
            echo "::error::Release-looking commit could not be read as a release record; failing instead of silently skipping release automation." >&2
            cat "$release_record_error" >&2
            exit 1
          fi

          echo "is-release=false" >> "$GITHUB_OUTPUT"

  release-pr:
    name: release pr
    # A release PR commit is generated by this workflow, so re-running it on its own output would
    # create a second release PR describing the first. Pull requests run the rehearsal job instead.
    needs: classify-push
    if: >-
      github.event_name != 'pull_request' &&
      github.repository_owner == 'leptoskit' &&
      needs.classify-push.outputs.is-release != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      # Dispatch the publish dry run against the prepared release branch.
      actions: write
      # Upload the release files as git blobs and a tree. The monochange GitHub App writes the
      # verified bot commit and manages the pull request; this job authenticates with OIDC.
      contents: write
      # Close a stale release pull request when no pending releaseable changesets remain.
      pull-requests: write
      id-token: write

    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # monochange reads history to build the changelog, so a shallow clone would produce a
          # release PR with an incomplete entry list.
          fetch-depth: 0
          persist-credentials: false

      - name: install rust
        uses: $/.github/actions/rust

      - name: cache rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: install monochange
        uses: $/.github/actions/install-monochange

      - name: refresh tags from origin
        run: git fetch --force --tags origin

      - name: validate the release configuration
        run: monochange step validate

      - name: check the workspace and changesets
        run: monochange check

      - name: report pending changesets
        id: pending
        shell: bash
        run: |
          set -euo pipefail

          if [ -d .changeset ]; then
            count=$(find .changeset -name '*.md' -type f | wc -l | tr -d ' ')
          else
            count=0
          fi

          case "$count" in
            ''|*[!0-9]*) count=0 ;;
          esac

          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Pending changesets: $count"

      - name: open or update the release pull request
        id: refresh
        if: steps.pending.outputs.count != '0'
        env:
          # monochange reads both names: GH_TOKEN for git and the GitHub API, GITHUB_TOKEN for the
          # blob and tree uploads.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # monochange.dev's GitHub App creates a verified release commit and opens the pull
          # request as the monochange bot, so the release pull request triggers its own checks
          # without a personal access token.
          MONOCHANGE_RELEASE_BACKEND: hosted
        shell: bash
        run: |
          set -euo pipefail

          # A changeset that only bumps `docs`/`none` produces no releaseable packages. Treat that
          # specific case as "nothing to release" rather than failing the workflow.
          if ! output="$(monochange run release --commit --create-pr 2>&1)"; then
            if printf '%s\n' "$output" | grep -q 'no releaseable packages were found in discovered changesets'; then
              echo "No releaseable packages in current changesets; skipping release PR refresh."
              echo "created=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            printf '%s\n' "$output" >&2
            exit 1
          fi
          printf '%s\n' "$output"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: dispatch publish dry run for the release branch
        if: steps.refresh.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          branch="monochange/release/release"
          git fetch --force --no-tags origin "+refs/heads/${branch}:refs/remotes/origin/${branch}"

          tag="$(monochange step release-record --from "origin/${branch}" --format json \
            | jq -r '[.record.release_targets[] | select(.tag == true)] | first | .tag_name // empty')"
          if [ -z "$tag" ]; then
            echo "::error::Could not determine the release tag for the dry run." >&2
            exit 1
          fi

          release_sha="$(git rev-parse "origin/${branch}^{commit}")"
          gh workflow run publish.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "tag=$tag" \
            -f "checkout_ref=$release_sha" \
            -f "dry_run=true"
          echo "Dispatched a publish dry run for $tag against $release_sha."

      - name: close stale release pull request
        if: steps.pending.outputs.count == '0' || steps.refresh.outputs.created == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          branch="monochange/release/release"
          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr_number" ]; then
            echo "Closing stale release PR #${pr_number} because no releaseable changesets are pending."
            gh pr close "$pr_number" --repo "$GITHUB_REPOSITORY" --delete-branch
          else
            echo "No pending releaseable changesets and no open release PR."
          fi

  # Every pull request rehearses the release it would contribute to. It runs the same validation,
  # planning, preview summary, and lockfile refresh as `release-pr`, but never commits or opens a
  # pull request, so a release problem shows up on the change that caused it.
  release-pr-simulated:
    name: release pr (simulated)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
      issues: read

    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: install rust
        uses: $/.github/actions/rust

      - name: cache rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: install monochange
        uses: $/.github/actions/install-monochange

      - name: validate the release configuration
        run: monochange step validate

      - name: check the workspace and changesets
        run: monochange check

      - name: report pending changesets
        id: pending
        shell: bash
        run: |
          set -euo pipefail

          if [ -d .changeset ]; then
            count=$(find .changeset -name '*.md' -type f | wc -l | tr -d ' ')
          else
            count=0
          fi

          case "$count" in
            ''|*[!0-9]*) count=0 ;;
          esac

          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Pending changesets: $count"

      - name: summarize release preview
        env:
          PENDING: ${{ steps.pending.outputs.count }}
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "## Release Preview"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$PENDING" -eq 0 ]; then
            release_record="$RUNNER_TEMP/release-record.json"
            if monochange step release-record --from HEAD --format json > "$release_record" 2>/dev/null; then
              resolved_commit="$(jq -r '.resolved_commit // ""' "$release_record")"
              record_commit="$(jq -r '.record_commit // ""' "$release_record")"
              if [ -n "$resolved_commit" ] && [ "$resolved_commit" = "$record_commit" ]; then
                {
                  echo "### Prepared release record"
                  echo '```json'
                  jq '{commit: .record_commit, version: .record.version, released_packages: .record.released_packages}' "$release_record"
                  echo '```'
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi

            echo "No pending changesets; nothing to release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### Changesets found"
            echo '```markdown'
            for f in .changeset/*.md; do
              echo "--- $f ---"
              cat "$f"
              echo ""
            done
            echo '```'
            echo ""
            echo "### Preview"
          } >> "$GITHUB_STEP_SUMMARY"

          if ! preview_output="$(monochange preview --format md 2>&1)"; then
            if printf '%s\n' "$preview_output" | grep -q 'no releaseable packages'; then
              echo "All pending changesets have bump \`none\`; nothing to release." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            printf '%s\n' "$preview_output" >&2
            exit 1
          fi

          printf '%s\n' "$preview_output" >> "$GITHUB_STEP_SUMMARY"

      - name: simulate the release pull request
        id: simulate
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          # The rehearsal stays local: it commits and opens nothing, and a pull request from a
          # fork must not need the monochange app or an OIDC token.
          MONOCHANGE_RELEASE_BACKEND: local
          PENDING: ${{ steps.pending.outputs.count }}
        shell: bash
        run: |
          set -euo pipefail

          if ! output="$(monochange run release --dry-run --commit --create-pr 2>&1)"; then
            if printf '%s\n' "$output" | grep -q 'no releaseable packages were found in discovered changesets'; then
              echo "All pending changesets have bump 'none'; there is no release pull request to prepare."
              echo "prepared=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            printf '%s\n' "$output" >&2
            exit 1
          fi
          printf '%s\n' "$output"

          if [ "$PENDING" -eq 0 ]; then
            echo "No pending changesets; there is no release pull request to prepare."
            echo "prepared=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Prepare the release for real, still without committing or opening a pull request.
          monochange run release
          echo "prepared=true" >> "$GITHUB_OUTPUT"

      - name: verify the prepared release
        if: steps.simulate.outputs.prepared == 'true'
        shell: bash
        run: |
          set -euo pipefail

          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          git diff --check
          echo "Release preparation succeeded; no release commit or pull request was created."

  # Runs after the release PR is merged: creates the release tag, drafts the GitHub release with
  # monochange's rendered notes, dispatches publish.yml, and comments on linked issues.
  release-post-merge:
    name: tag and draft the release
    needs: classify-push
    if: >-
      github.event_name != 'pull_request' &&
      github.repository_owner == 'leptoskit' &&
      needs.classify-push.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write
      issues: write

    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: install monochange
        uses: $/.github/actions/install-monochange

      - name: configure tagger identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: configure git authentication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh auth setup-git

      - name: refresh tags from origin
        run: git fetch --force --tags origin

      - name: confirm the commit is a release commit and resolve tag
        id: record
        shell: bash
        run: |
          set -euo pipefail

          record_json="$RUNNER_TEMP/release-record.json"
          monochange step release-record --from HEAD --format json > "$record_json"

          is_release_commit="$(jq -r '.resolved_commit == .record_commit' "$record_json")"
          if [ "$is_release_commit" != "true" ]; then
            echo "::error::HEAD looks like a release commit but carries no matching release record." >&2
            exit 1
          fi

          tag="$(jq -r '[.record.release_targets[] | select(.tag == true)] | first | .tag_name // empty' "$record_json")"
          if [ -z "$tag" ] || [[ "$tag" != v* ]]; then
            echo "::error::Unexpected or missing release tag '${tag}' in release record." >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag from $(git rev-parse HEAD)."

      - name: create the release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.record.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          sha="$(git rev-parse HEAD)"
          if existing="$(git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}^{commit}")"; then
            if [ "$existing" != "$sha" ]; then
              echo "::error::Tag ${RELEASE_TAG} already exists at ${existing}, not ${sha}." >&2
              exit 1
            fi
            echo "Tag ${RELEASE_TAG} already exists at ${sha}; continuing."
          else
            monochange step tag-release --from HEAD --push
          fi

      - name: wait for the tag on the remote
        env:
          RELEASE_TAG: ${{ steps.record.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 12); do
            if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
              echo "Tag ${RELEASE_TAG} is visible on the remote."
              exit 0
            fi
            echo "  attempt ${attempt}/12: tag not visible yet; sleeping 5s"
            sleep 5
          done
          echo "::error::Tag ${RELEASE_TAG} was not visible on the remote after waiting." >&2
          exit 1

      - name: create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.record.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Draft release ${RELEASE_TAG} already exists; continuing."
          else
            monochange step publish-release --from-ref HEAD --draft --format json
          fi

      - name: dispatch the publish workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.record.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          gh workflow run publish.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "tag=$RELEASE_TAG" \
            -f "checkout_ref=$(git rev-parse HEAD)"
          echo "Dispatched publish.yml for ${RELEASE_TAG}."

      - name: comment on released issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          monochange step comment-released-issues --from-ref HEAD --auto-close-issues
